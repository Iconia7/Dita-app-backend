[tool.black]
line-length = 120
target-version = ["py313"]

extend-exclude = '''
/(
    venv
  | \.tox
  | migrations
  | config/settings
)/
'''

[tool.isort]
profile = "black"
line_length = 120
known_django = "django"
known_first_party = ["apps", "config"]
sections = [
  "FUTURE",
  "STDLIB",
  "DJANGO",
  "THIRDPARTY",
  "FIRSTPARTY",
  "LOCALFOLDER",
]
skip = ["venv", ".tox"]
skip_glob = ["*/migrations/*", "config/settings/*", "manage.py"]
